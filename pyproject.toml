[project]
name = "deep-research-agent"
version = "0.1.0"
description = "多智能体深度研究系统：规划 -> 并行研究员 -> 反思 -> 带引用报告"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-openai",
    "langchain-deepseek",
    "pydantic-settings",
    "python-dotenv",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eval: 端到端质量评测（慢，会真实调用 LLM）"]
addopts = "-m 'not eval'"

[tool.ruff]
target-version = "py312"
line-length = 100
